<!-- SVG & 96x96 Favicon Links -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">

<!-- Web App Manifest -->
<link rel="manifest" href="/site.webmanifest">

<!-- Apple & Mobile PWA Meta -->
<meta name="apple-mobile-web-app-title" content="Arkady's Archive">
<meta name="theme-color" content="#ffffff" id="pwa-theme-color">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Service Worker & Dynamic Status Bar Management -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('Service Worker registered scope:', reg.scope))
        .catch((err) => console.error('Service Worker registration failed:', err));
    });
  }

  (function() {
    function synchronizeStatusBar() {
      const metaTag = document.getElementById('pwa-theme-color');
      if (!metaTag) return;
      const bodyBgColor = window.getComputedStyle(document.body).backgroundColor;
      metaTag.setAttribute('content', bodyBgColor);
    }

    // ⚡ Execute instantly to prevent status bar color flickering on slow connections
    synchronizeStatusBar();

    // Safety fallback once full DOM layout engine stabilizes
    document.addEventListener('DOMContentLoaded', synchronizeStatusBar);

    // Listen for PaperMod's manual dark/light toggle button clicks
    window.addEventListener('load', () => {
      const themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          setTimeout(synchronizeStatusBar, 50);
        });
      }
    });
  })();
</script>
