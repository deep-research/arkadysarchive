baseURL: https://arkadysarchive.com/
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
theme: ["PaperMod"]

pagination:
  pagerSize: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

googleAnalytics: "G-GMZ6Q8LXT2"

services:
  disqus:
    shortname: arkadys-archive

outputs:
  home:
    - HTML
    - RSS
    - JSON

languages:
  en:
    languageCode: en-us
    languageName: English
    weight: 1
    title: "Arkady's Archive"
    params:
      env: production
      title: "Arkady's Archive"
      description: "A website by Arkady focused on news and science."
      keywords: [News, Portfolio, Science, Chemistry, Religion]
      author: Arkady
      images: ["/assets/seoCard.png"]
      DateFormat: "January 2, 2006"
      defaultTheme: auto
      disableThemeToggle: false
      ShowReadingTime: true
      ShowShareButtons: true
      ShowPostNavLinks: true
      ShowBreadCrumbs: true
      ShowCodeCopyButtons: false
      ShowWordCount: true
      ShowRssButtonInSectionTermList: true
      UseHugoToc: true
      disableSpecial1stPost: false
      disableScrollToTop: false
      comments: true
      enableDisqus: true
      hidemeta: false
      hideSummary: false
      showtoc: false
      tocopen: false
      assets:
        favicon: "/assets/favicon.ico"
        favicon16x16: "/assets/favicon-16x16.png"
        favicon32x32: "/assets/favicon-132x32.png"
        apple_touch_icon: "/assets/apple-touch-icon.png"
        safari_pinned_tab: "/assets/safari-pinned-tab.svg"
      label:
        text: "Arkady's Archive"
      homeInfoParams:
        Title: Home
        Content: "Welcome to Arkady's Archive!"
      cover:
        hidden: true
        hiddenInList: true
        hiddenInSingle: true
      fuseOpts:
        isCaseSensitive: false
        shouldSort: true
        location: 0
        distance: 1000
        threshold: 0.4
        minMatchCharLength: 0
        limit: 10
        keys: ["title", "permalink", "summary", "content"]
    menu:
      main:
        - identifier: Archive
          name: Archive
          url: /archive/
          weight: 10
        - identifier: Search
          name: Search
          url: /search/
          weight: 20
        - identifier: Categories
          name: Categories
          url: /categories/
          weight: 30
        - identifier: Tags
          name: Tags
          url: /tags/
          weight: 40
        - identifier: About
          name: About
          url: /about/
          weight: 50

  ru:
    languageCode: ru-ru
    languageName: Русский
    weight: 2
    title: "Arkady's Archive"
    params:
      env: production
      title: "Arkady's Archive"
      description: "Сайт Аркадия, посвященный новостям и науке."
      keywords: [Новости, Портфолио, Наука, Химия, Религия]
      author: Arkady
      images: ["/assets/seoCard.png"]
      DateFormat: "2 January 2006"
      defaultTheme: auto
      disableThemeToggle: false
      ShowReadingTime: true
      ShowShareButtons: true
      ShowPostNavLinks: true
      ShowBreadCrumbs: true
      ShowCodeCopyButtons: false
      ShowWordCount: true
      ShowRssButtonInSectionTermList: true
      UseHugoToc: true
      disableSpecial1stPost: false
      disableScrollToTop: false
      comments: true
      enableDisqus: true
      hidemeta: false
      hideSummary: false
      showtoc: false
      tocopen: false
      assets:
        favicon: "/assets/favicon.ico"
        favicon16x16: "/assets/favicon-16x16.png"
        favicon32x32: "/assets/favicon-132x32.png"
        apple_touch_icon: "/assets/apple-touch-icon.png"
        safari_pinned_tab: "/assets/safari-pinned-tab.svg"
      label:
        text: "Arkady's Archive"
      homeInfoParams:
        Title: Главная
        Content: "Добро пожаловать в Arkady's Archive!"
      cover:
        hidden: true
        hiddenInList: true
        hiddenInSingle: true
      fuseOpts:
        isCaseSensitive: false
        shouldSort: true
        location: 0
        distance: 1000
        threshold: 0.4
        minMatchCharLength: 0
        limit: 10
        keys: ["title", "permalink", "summary", "content"]
    menu:
      main:
        - identifier: Archive
          name: Архив
          url: /archive/
          weight: 10
        - identifier: Search
          name: Поиск
          url: /search/
          weight: 20
        - identifier: Categories
          name: Категории
          url: /categories/
          weight: 30
        - identifier: Tags
          name: Теги
          url: /tags/
          weight: 40
        - identifier: About
          name: О себе
          url: /about/
          weight: 50

pygmentsUseClasses: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

